name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml starlette sse-starlette
      - run: python test_router.py
      - run: python test_harness.py
      - run: python test_workflow.py
      - run: python test_knowledge.py
      - run: python test_webapi.py
      - run: python test_activity.py
      - run: python -m compileall -q omnigent

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
