[project]
name = "omnigent"
version = "0.1.0"
description = "Multi-harness orchestrator over logged-in agent CLIs (Claude, Grok, Codex), built with CrewAI."
requires-python = ">=3.10,<3.14"
dependencies = [
    "pyyaml>=6.0",
    "crewai>=0.80",
]

[project.scripts]
omnigent = "omnigent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["omnigent"]
